<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Emails - Gmail Intelligence</title>
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/emails.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="header-left">
        <span class="logo">Gmail Intelligence</span>
      </div>
      <div class="header-right">
        <span class="user-name" id="userName">Loading...</span>
      </div>
    </header>

    <main class="app-main">
      <div class="emails-page">
        <div class="filter-bar">
          <select id="filterSelect">
            <option value="all">All</option>
            <option value="important">Important</option>
            <option value="jobs">Jobs</option>
            <option value="travel">Travel</option>
            <option value="interviews">Interviews</option>
            <option value="deadlines">Deadlines</option>
          </select>
          <input type="text" id="searchInput" placeholder="Search emails...">
        </div>

        <div class="emails-list" id="emailsList">
          <div class="loading-state">
            <p>Loading emails...</p>
          </div>
        </div>
      </div>
    </main>
    <footer class="app-footer">
      <div class="bottom-nav">
        <a href="/dashboard.html" class="bottom-nav-item active">
          <span>Home</span>
        </a>
        <a href="/jobs.html" class="bottom-nav-item">
          <span>Jobs</span>
        </a>
        <a href="/trips.html" class="bottom-nav-item">
          <span>Trips</span>
        </a>
        <a href="/emails.html" class="bottom-nav-item">
          <span>Emails</span>
        </a>
        <a href="/settings.html" class="bottom-nav-item">
          <span>Settings</span>
        </a>
      </div>
    </footer>
  </div>
  <script type="module" src="/js/auth.js"></script>
  <script type="module" src="/js/api.js"></script>
  <script type="module" src="/js/emails.js"></script>
</body>
</html>
