<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gmail Intelligence</title>
  <link rel="stylesheet" href="/css/login.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="logo">
        <span>Gmail Intelligence</span>
      </div>
      <h2>Understand what matters in your inbox.</h2>
      <p>We use read-only Gmail access to analyze your emails.</p>
      <button class="btn-continue" onclick="loginWithGoogle()">Continue with Google</button>
    </div>
  </div>
  <script>
    console.log('[Login] Inline script running, path:', window.location.pathname);
    window.addEventListener('DOMContentLoaded', () => {
      console.log('[Login] DOMContentLoaded fired');
    });
  </script>
  <script type="module" src="/js/auth.js"></script>
  <script type="module" src="/js/api.js"></script>
</body>
</html>
